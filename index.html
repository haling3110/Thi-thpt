<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THPT2027 MASTER</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="header-top">
            <h1>🌿 THPT2027 MASTER</h1>
            <button id="theme-toggle" class="btn-toggle">🌙 Chế độ tối</button>
        </div>
        <p>Website học tập của Linh</p>
    </header>

    <!-- BỘ ĐẾM THỜI GIAN POMODORO -->
    <section class="pomodoro-card">
        <h3>⏱️ Góc Tập Trung (Pomodoro)</h3>
        <div id="timer">20:00</div>
        <div class="pomo-buttons">
            <button onclick="startTimer()">Bắt đầu học (20p)</button>
            <button onclick="pauseTimer()">Tạm dừng</button>
            <button onclick="resetTimer()">Đặt lại</button>
        </div>
        <p id="pomo-status">Sẵn sàng để bứt phá kiến thức!</p>
    </section>

    <main>
        <a href="toan.html" class="card-link">
            <div class="card">
                <h2>📘 Toán</h2>
                <p>Ôn luyện THPT 2027</p>
            </div>
        </a>

        <a href="van.html" class="card-link">
            <div class="card">
                <h2>📖 Văn</h2>
                <p>Nghị luận - Đọc hiểu</p>
            </div>
        </a>

        <a href="su.html" class="card-link">
            <div class="card">
                <h2>🏛️ Lịch sử</h2>
                <p>Tóm tắt - Timeline</p>
            </div>
        </a>

        <a href="dia.html" class="card-link">
            <div class="card">
                <h2>🌍 Địa lí</h2>
                <p>Atlat - Kỹ năng</p>
            </div>
        </a>
    </main>

  <script src="script.js"></script>
</body>
</html>
